name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    env:
      TAO_REQUIRE_CONFINEMENT_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Allow bubblewrap user namespaces on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          before="$(sysctl kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined kernel.unprivileged_userns_clone user.max_user_namespaces)"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test "$(command -v bwrap)" = /usr/bin/bwrap
          test "$(readlink -f /usr/bin/bwrap)" = /usr/bin/bwrap
          test "$(stat -c %u /usr/bin/bwrap)" = 0
          test ! -u /usr/bin/bwrap
          test -z "$(find /usr/bin/bwrap -perm /022 -print)"
          # An executable-scoped userns exception, not an additional sandbox.
          # Keep global restrictions and Tao's namespace/mount isolation intact.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile tao-ci-bwrap /usr/bin/bwrap flags=(unconfined) {' \
            '  userns,' \
            '}' > "$RUNNER_TEMP/tao-ci-bwrap"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/tao-ci-bwrap" /etc/apparmor.d/tao-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/tao-ci-bwrap
          sudo grep -F 'tao-ci-bwrap ' /sys/kernel/security/apparmor/profiles
          after="$(sysctl kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined kernel.unprivileged_userns_clone user.max_user_namespaces)"
          printf '%s\n' "$after"
          test "$before" = "$after"

      - name: Report Linux process sandbox test outcome
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          go test -count=1 -v ./internal/merge -run '^TestSingleMergeProcessSandboxHidesTaoParent$' | tee "$RUNNER_TEMP/tao-confinement-result.log"
          grep -q '^--- PASS: TestSingleMergeProcessSandboxHidesTaoParent ' "$RUNNER_TEMP/tao-confinement-result.log"

      - name: Verify no third-party dependencies
        run: make verify-no-deps

      - name: Test changelog automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build
        run: make build

      - name: Cross-build release targets
        run: make build-targets

      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: make lint

      # Native lint on macOS already covers darwin; this pass lints darwin-gated files from Linux.
      - name: Lint darwin-gated files
        run: make lint-darwin

  macos-test:
    name: Build and test on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Build
        run: make build

      - name: Test
        run: make test
