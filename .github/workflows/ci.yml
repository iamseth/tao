name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Verify no third-party dependencies
        run: make verify-no-deps

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Modernize check
        run: make modernize-check

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: make lint

  macos-test:
    name: Build and test on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Build
        run: make build

      - name: Test
        run: make test
